# HTTP-only config used during initial Let's Encrypt certificate issuance.
# deploy.sh uses this first, then replaces it with nginx.conf (HTTPS).

server {
    listen 80;
    server_name djam.tirskix.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
